{% macro icon(name, size=20, cls='') -%}
<svg class="icon {{ cls }}" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
  {%- if name == 'home' -%}
    <path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9.5 21v-6h5v6"/>
  {%- elif name == 'building' -%}
    <rect x="4" y="3" width="16" height="18" rx="1.5"/><path d="M9 7h.01M15 7h.01M9 11h.01M15 11h.01M9 15h.01M15 15h.01M10 21v-3h4v3"/>
  {%- elif name == 'calendar' -%}
    <rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/>
  {%- elif name == 'clock' -%}
    <circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
  {%- elif name == 'plus' -%}
    <path d="M12 5v14M5 12h14"/>
  {%- elif name == 'check' -%}
    <path d="m5 12 4 4L19 6"/>
  {%- elif name == 'x' -%}
    <path d="M6 6l12 12M18 6 6 18"/>
  {%- elif name == 'alert' -%}
    <path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4M12 17h.01"/>
  {%- elif name == 'info' -%}
    <circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>
  {%- elif name == 'search' -%}
    <circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/>
  {%- elif name == 'arrow-right' -%}
    <path d="M5 12h14M13 6l6 6-6 6"/>
  {%- elif name == 'arrow-left' -%}
    <path d="M19 12H5M11 18l-6-6 6-6"/>
  {%- elif name == 'bell' -%}
    <path d="M18 8a6 6 0 0 0-12 0c0 7-3 8-3 8h18s-3-1-3-8"/><path d="M10.3 21a2 2 0 0 0 3.4 0"/>
  {%- elif name == 'logout' -%}
    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/>
  {%- elif name == 'lock' -%}
    <rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/><path d="M12 15v2"/>
  {%- elif name == 'user' -%}
    <circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>
  {%- elif name == 'users' -%}
    <circle cx="9" cy="8" r="3.5"/><path d="M2.5 21a6.5 6.5 0 0 1 13 0"/><path d="M16 5.2a3.5 3.5 0 0 1 0 5.6M18 14.2a6.5 6.5 0 0 1 3.5 6.8"/>
  {%- elif name == 'grid' -%}
    <rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>
  {%- elif name == 'list' -%}
    <path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>
  {%- elif name == 'settings' -%}
    <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/>
  {%- elif name == 'door' -%}
    <path d="M4 21h16"/><path d="M6 21V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v17"/><path d="M14 12h.01"/>
  {%- elif name == 'chevron-left' -%}
    <path d="m15 18-6-6 6-6"/>
  {%- elif name == 'chevron-right' -%}
    <path d="m9 18 6-6-6-6"/>
  {%- elif name == 'chevron-down' -%}
    <path d="m6 9 6 6 6-6"/>
  {%- elif name == 'map-pin' -%}
    <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="3"/>
  {%- elif name == 'filter' -%}
    <path d="M3 5h18l-7 8v6l-4 2v-8Z"/>
  {%- elif name == 'shield' -%}
    <path d="M12 3 5 6v6c0 5 3.5 7.5 7 9 3.5-1.5 7-4 7-9V6Z"/><path d="m9 12 2 2 4-4"/>
  {%- elif name == 'file' -%}
    <path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9Z"/><path d="M14 3v6h6M8 13h8M8 17h5"/>
  {%- elif name == 'check-circle' -%}
    <circle cx="12" cy="12" r="9"/><path d="m8 12 2.5 2.5L16 9"/>
  {%- elif name == 'x-circle' -%}
    <circle cx="12" cy="12" r="9"/><path d="m9 9 6 6M15 9l-6 6"/>
  {%- elif name == 'ban' -%}
    <circle cx="12" cy="12" r="9"/><path d="m5.6 5.6 12.8 12.8"/>
  {%- elif name == 'refresh' -%}
    <path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 4v5h-5"/>
  {%- elif name == 'eye' -%}
    <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>
  {%- elif name == 'eye-off' -%}
    <path d="M3 3l18 18"/><path d="M10.6 10.6a3 3 0 0 0 4.2 4.2"/><path d="M9.9 5.2A11 11 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 4.1M6.4 6.4A17.8 17.8 0 0 0 2 12s3.5 7 10 7a10.8 10.8 0 0 0 4.2-.8"/>
  {%- elif name == 'help' -%}
    <circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 4 2c-.9.7-1.5 1.2-1.5 2.5M12 17h.01"/>
  {%- elif name == 'external' -%}
    <path d="M14 4h6v6M20 4l-9 9"/><path d="M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/>
  {%- elif name == 'menu' -%}
    <path d="M4 7h16M4 12h16M4 17h16"/>
  {%- elif name == 'spark' -%}
    <path d="M12 3v4M12 17v4M3 12h4M17 12h4M5.6 5.6l2.8 2.8M15.6 15.6l2.8 2.8M18.4 5.6l-2.8 2.8M8.4 15.6l-2.8 2.8"/>
  {%- elif name == 'sun' -%}
    <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
  {%- elif name == 'trash' -%}
    <path d="M4 7h16M9 7V4h6v3M6 7l1 14h10l1-14"/><path d="M10 11v6M14 11v6"/>
  {%- elif name == 'key' -%}
    <circle cx="8" cy="15" r="4"/><path d="m11 12 9-9M17 6l3 3M14 9l2 2"/>
  {%- elif name == 'edit' -%}
    <path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>
  {%- endif -%}
</svg>
{%- endmacro %}

{% macro logo(size=38, inverse=false) -%}
<span class="brand{% if inverse %} brand--inverse{% endif %}">
  <span class="brand-mark" style="--logo-size: {{ size }}px">
    <img src="{{ url_for('static', filename='img/idb-logo.png', v=2) }}" width="{{ size }}" height="{{ size }}" alt="">
  </span>
  <span class="brand-text">
    <span class="brand-name">IDB <em>Room</em></span>
    <span class="brand-sub">Sistem Reservasi Ruangan</span>
  </span>
</span>
{%- endmacro %}
